# dev:  docker compose up dev          ->  http://localhost:5173 (HMR)
# prod: docker compose up --build prod ->  http://localhost:8080
services:
  dev:
    build:
      context: ./frontend
      target: dev
    ports:
      - "5173:5173"
    volumes:
      # live-mount the source so HMR picks up edits from the host
      - ./frontend:/app
      # mask the mount with the image's node_modules (host's would be wrong arch/missing)
      - /app/node_modules

  prod:
    build:
      context: ./frontend
      target: prod
    ports:
      - "8080:80"
