server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # single page app: any path falls back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # videos are immutable once delivered - let browsers cache them hard
    location /clips/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # allow seeking in long clips
        add_header Accept-Ranges bytes;
    }
}
